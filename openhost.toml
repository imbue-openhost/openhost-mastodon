[app]
name = "mastodon"
version = "0.1.0"
description = "Mastodon — federated microblogging. Bundles postgres, redis, puma, sidekiq, streaming, Caddy, and a Cloud in a Bottle owner-SSO sidecar in a single container under s6-overlay."

[runtime.container]
image = "Dockerfile"
# Caddy front-door inside the container. Caddy fans out to puma (3000)
# and the streaming server (4000); see Caddyfile.
port = 8080

[routing]
# Mastodon serves /health on Puma; the auth-proxy and Caddy pass it
# through unmodified (/health is on the auth-proxy's no-auto-login list,
# so the healthcheck is never redirected into an SSO flow).
health_check = "/health"
# ALL paths must be public. Mastodon federates with the wider fediverse
# — federation requests come from random remote Mastodon instances over
# /api/v1, /inbox, /.well-known/webfinger, etc. and must not hit the
# OpenHost owner-auth gate. The web UI itself is also public (login is
# Mastodon's own session/cookie auth on top).
#
# Owner SSO does NOT rely on the owner-auth gate: the OpenHost router
# still stamps X-OpenHost-Is-Owner on the owner's requests even to a
# public-path app, and the in-container auth_proxy consumes that header
# to auto-login the owner. Federation/anonymous traffic (no such header)
# passes through untouched. See README "Owner SSO".
public_paths = ["/"]

[resources]
# Five heavy processes (postgres, redis, puma, sidekiq, node-streaming)
# plus Caddy, plus the SSO sidecars (the Python auth-proxy is tiny; the
# session-minter is a second Rails process that adds ~150-200 MB
# resident for the warm Rails env it keeps loaded). Empirical floor for
# a small single-user instance federating with a handful of peers is
# around 2.5 GB; 3 GB gives headroom for sidekiq enqueue spikes when
# media transcodes hit at the same time as a federation flood plus the
# minter's resident footprint.
memory_mb = 3072
cpu_millicores = 2000

[data]
# Persistent state lives under $OPENHOST_APP_DATA_DIR:
#   postgres/            — PGDATA (postgres 15 cluster, initdb'd on
#                          first boot, backed up across redeploys)
#   redis/               — Redis RDB snapshots
#   mastodon-uploads/    — paperclip media (avatars, attachments,
#                          custom emoji). Bind-mounted at runtime onto
#                          /opt/mastodon/public/system.
#   mastodon-secrets.env — generated once on first boot. Contains
#                          SECRET_KEY_BASE, OTP_SECRET, the VAPID
#                          keypair, and the auto-generated postgres
#                          password. Never re-generated; cycling these
#                          would invalidate every existing session and
#                          break web-push notifications.
#
# No admin-password.txt: the owner logs in via OpenHost SSO
# (auth_proxy.py + session_minter.rb), so the bootstrap discards the
# generated account password rather than persisting a plaintext
# credential where file-browser and other access_all_data apps could
# read it. Legacy password files from older builds are deleted on boot.
app_data = true
# Per-boot scratch (Rails tmp/, sidekiq pids, postgres socket dir).
app_temp_data = true
